# Blocks 单仓 CI。GitHub 只认仓库根的 .github/workflows。
# 内核在 Kernel/，运行镜像在 Runtime/。冒烟用仓里已有的 BOOTX64.EFI，不在 CI 里编 Boot。
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make python3 ripgrep

      - name: Clone lwIP
        working-directory: Kernel
        run: |
          if [ ! -f ThirdParty/lwip/src/include/lwip/init.h ]; then
            rm -rf ThirdParty/lwip
            git clone --depth 1 --branch STABLE-2_2_0_RELEASE \
              https://github.com/lwip-tcpip/lwip.git ThirdParty/lwip
          fi

      - name: Fetch FreeType 2.13.2
        working-directory: Kernel
        run: ./Scripts/fetch-freetype.sh

      - name: Build
        working-directory: Kernel
        run: ./build.sh x86_64

      - name: Check Kernel.elf
        working-directory: Kernel
        run: test -f Build/HAL/X64/Kernel.elf && ls -lh Build/HAL/X64/Kernel.elf

      - name: Upload Kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-x86_64
          path: Kernel/Build/HAL/X64/Kernel.elf
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget tar python3 ripgrep

      - name: Fetch xPack aarch64-none-elf
        working-directory: Kernel
        run: |
          mkdir -p Tools/Tarballs
          wget -q -O Tools/Tarballs/arm-gnu.tar.gz \
            'https://github.com/xpack-dev-tools/aarch64-none-elf-gcc-xpack/releases/download/v13.2.1-1.1/xpack-aarch64-none-elf-gcc-13.2.1-1.1-linux-x64.tar.gz'
          tar -xzf Tools/Tarballs/arm-gnu.tar.gz -C Tools
          Tools/xpack-aarch64-none-elf-gcc-*/bin/aarch64-none-elf-gcc --version | head -1

      - name: Build
        working-directory: Kernel
        run: ./build.sh arm64

      - name: Check Kernel.elf
        working-directory: Kernel
        run: test -f Build/HAL/Arm64/Kernel.elf && ls -lh Build/HAL/Arm64/Kernel.elf

      - name: Upload Kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-arm64
          path: Kernel/Build/HAL/Arm64/Kernel.elf
          retention-days: 7

  build-riscv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget tar python3 ripgrep

      - name: Fetch xPack riscv-none-elf
        working-directory: Kernel
        run: |
          mkdir -p Tools/Tarballs
          wget -q -O Tools/Tarballs/riscv-gnu.tar.gz \
            'https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz'
          tar -xzf Tools/Tarballs/riscv-gnu.tar.gz -C Tools
          Tools/xpack-riscv-none-elf-gcc-*/bin/riscv-none-elf-gcc --version | head -1

      - name: Build
        working-directory: Kernel
        run: ./build.sh riscv

      - name: Check Kernel.elf
        working-directory: Kernel
        run: test -f Build/HAL/RiscV/Kernel.elf && ls -lh Build/HAL/RiscV/Kernel.elf

      - name: Upload Kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-riscv
          path: Kernel/Build/HAL/RiscV/Kernel.elf
          retention-days: 7

  smoke:
    needs: [build-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Kernel.elf
        uses: actions/download-artifact@v4
        with:
          name: Kernel-x86_64
          path: artifact

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 ovmf

      - name: Place Kernel.elf
        run: |
          test -f Runtime/Esp/X64/EFI/BOOT/BOOTX64.EFI
          mkdir -p Runtime/RootFs/X64
          cp artifact/Kernel.elf Runtime/RootFs/X64/Kernel.elf
          test -f Runtime/RootFs/X64/Kernel.elf

      - name: Smoke boot
        working-directory: Runtime
        run: SMOKE_TIMEOUT=180 ./smoke-boot.sh --no-sync
