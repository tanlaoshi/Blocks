# tag v* 时编三架构内核并挂到 GitHub Release。工作目录在 Kernel/。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make wget tar python3 ripgrep

      - name: Clone lwIP
        working-directory: Kernel
        run: |
          git clone --depth 1 --branch STABLE-2_2_0_RELEASE \
            https://github.com/lwip-tcpip/lwip.git ThirdParty/lwip

      - name: Fetch xPack toolchains (arm64 + riscv)
        working-directory: Kernel
        run: |
          mkdir -p Tools/Tarballs Tools/Extract
          wget -q -O Tools/Tarballs/arm-gnu.tar.gz \
            'https://github.com/xpack-dev-tools/aarch64-none-elf-gcc-xpack/releases/download/v13.2.1-1.1/xpack-aarch64-none-elf-gcc-13.2.1-1.1-linux-x64.tar.gz'
          wget -q -O Tools/Tarballs/riscv-gnu.tar.gz \
            'https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz'
          tar -xzf Tools/Tarballs/arm-gnu.tar.gz -C Tools/Extract
          tar -xzf Tools/Tarballs/riscv-gnu.tar.gz -C Tools/Extract

      - name: Build x86_64
        working-directory: Kernel
        run: |
          rm -rf Build
          ./build.sh x86_64
          test -f Build/HAL/X64/Kernel.elf
          cp Build/HAL/X64/Kernel.elf "$GITHUB_WORKSPACE/Kernel-x86_64.elf"

      - name: Build arm64
        working-directory: Kernel
        run: |
          rm -rf Build
          ./build.sh arm64
          test -f Build/HAL/Arm64/Kernel.elf
          cp Build/HAL/Arm64/Kernel.elf "$GITHUB_WORKSPACE/Kernel-arm64.elf"

      - name: Build riscv
        working-directory: Kernel
        run: |
          rm -rf Build
          ./build.sh riscv
          test -f Build/HAL/RiscV/Kernel.elf
          cp Build/HAL/RiscV/Kernel.elf "$GITHUB_WORKSPACE/Kernel-riscv.elf"

      - name: Pack docs
        run: tar -czf Blocks-Documents.tar.gz README.md Documents

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Kernel-x86_64.elf
            Kernel-arm64.elf
            Kernel-riscv.elf
            Blocks-Documents.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
