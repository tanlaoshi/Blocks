# Build Kernel（三架构 + smoke；运行镜像在 Runtime）
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make

      - name: Clone lwIP
        run: |
          git clone --depth 1 --branch STABLE-2_2_0_RELEASE \
            https://github.com/lwip-tcpip/lwip.git ThirdParty/lwip

      - name: Build
        run: ./build.sh x86_64

      - name: Check Kernel.elf
        run: test -f Build/HAL/X64/Kernel.elf && ls -lh Build/HAL/X64/Kernel.elf

      - name: Upload Kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-x86_64
          path: Build/HAL/X64/Kernel.elf
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget tar

      - name: Fetch xPack aarch64-none-elf (Tools/README)
        run: |
          mkdir -p Tools/Tarballs Tools/Extract
          wget -q -O Tools/Tarballs/arm-gnu.tar.gz \
            'https://github.com/xpack-dev-tools/aarch64-none-elf-gcc-xpack/releases/download/v13.2.1-1.1/xpack-aarch64-none-elf-gcc-13.2.1-1.1-linux-x64.tar.gz'
          tar -xzf Tools/Tarballs/arm-gnu.tar.gz -C Tools/Extract
          Tools/Extract/xpack-aarch64-none-elf-gcc-*/bin/aarch64-none-elf-gcc --version | head -1

      - name: Build
        run: ./build.sh arm64

      - name: Check Kernel.elf
        run: test -f Build/HAL/Arm64/Kernel.elf && ls -lh Build/HAL/Arm64/Kernel.elf

      - name: Upload Kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-arm64
          path: Build/HAL/Arm64/Kernel.elf
          retention-days: 7

  build-riscv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make wget tar

      - name: Fetch xPack riscv-none-elf (Tools/README)
        run: |
          mkdir -p Tools/Tarballs Tools/Extract
          wget -q -O Tools/Tarballs/riscv-gnu.tar.gz \
            'https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz'
          tar -xzf Tools/Tarballs/riscv-gnu.tar.gz -C Tools/Extract
          Tools/Extract/xpack-riscv-none-elf-gcc-*/bin/riscv-none-elf-gcc --version | head -1

      - name: Build
        run: ./build.sh riscv

      - name: Check Kernel.elf
        run: test -f Build/HAL/RiscV/Kernel.elf && ls -lh Build/HAL/RiscV/Kernel.elf

      - name: Upload Kernel.elf
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-riscv
          path: Build/HAL/RiscV/Kernel.elf
          retention-days: 7

  smoke:
    needs: [build-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kernel.elf
        uses: actions/download-artifact@v4
        with:
          name: Kernel-x86_64
          path: artifact

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 ovmf

      - name: Place Kernel.elf
        run: |
          if [ -d Runtime/Esp ]; then
            IMG=Runtime
          elif [ -d ../Runtime/Esp ]; then
            IMG=../Runtime
          else
            echo "error: Runtime not in this checkout" >&2
            exit 1
          fi
          mkdir -p "$IMG/RootFs/X64"
          cp artifact/Kernel.elf "$IMG/RootFs/X64/Kernel.elf"
          test -f "$IMG/RootFs/X64/Kernel.elf"
          test -f "$IMG/Esp/X64/EFI/BOOT/BOOTX64.EFI"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Smoke boot (TOY_SMP=1)
        run: |
          export TOYOS_ROOT="$GITHUB_WORKSPACE"
          TOY_SMP=1 SMOKE_TIMEOUT=120 "$IMG/smoke-boot.sh"
